services:
  # ----------------------------------------------------
  # 1. PostgreSQL - Primary Database
  # ----------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: jledger-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jledger_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d jledger_db"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - jledger-network

  # ----------------------------------------------------
  # 2. Redis - In-Memory Cache
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: jledger-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jledger-network

  # ----------------------------------------------------
  # 3. Zookeeper
  # ----------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: jledger-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - jledger-network

  # ----------------------------------------------------
  # 4. Apache Kafka
  # ----------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: jledger-kafka
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:29092 1 20"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jledger-network

  # ----------------------------------------------------
  # 5. Database Migrations (Pre-startup)
  # ----------------------------------------------------
  finance-migration:
    image: flyway/flyway:10-alpine
    container_name: jledger-finance-migration
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./j-ledger-core/finance-service/src/main/resources/db/migration:/flyway/sql
    command: -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=finance -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} -connectRetries=60 migrate
    networks:
      - jledger-network

  portal-migration:
    build:
      context: ./j-ledger-portal/apps/portal-service
      dockerfile: Dockerfile
    image: j-ledger/portal-service:latest
    container_name: jledger-portal-migration
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - jledger-network

  # ----------------------------------------------------
  # 6. Finance Service (Java/Spring Boot)
  # ----------------------------------------------------
  finance-service:
    build:
      context: ./j-ledger-core/finance-service
    image: j-ledger/finance-service:latest
    container_name: jledger-finance
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      finance-migration:
        condition: service_completed_successfully
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=finance
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      - JLEDGER_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - jledger.internal.secret=${JLEDGER_INTERNAL_SECRET}
    networks:
      - jledger-network
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 7. Portal Service (NestJS)
  # ----------------------------------------------------
  portal-service:
    build:
      context: ./j-ledger-portal/apps/portal-service
      dockerfile: Dockerfile
    image: j-ledger/portal-service:latest
    container_name: jledger-portal
    depends_on:
      redis:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      portal-migration:
        condition: service_completed_successfully
    environment:
      - PORT=3000
      - FINANCE_SERVICE_URL=http://finance-service:8081
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JLEDGER_REDIS_ADDRESS=redis://redis:6379
      - JLEDGER_REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REGISTRATION_SECRET=${JWT_REGISTRATION_SECRET}
      - JLEDGER_INTERNAL_SECRET=${JLEDGER_INTERNAL_SECRET}
    networks:
      - jledger-network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 8. Notification Worker (NestJS)
  # ----------------------------------------------------
  notification-worker:
    build:
      context: ./j-ledger-portal/apps/notification-worker
      dockerfile: Dockerfile
    image: j-ledger/notification-worker:latest
    container_name: jledger-notification-worker
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - KAFKA_BROKERS=kafka:29092
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    networks:
      - jledger-network

  # ----------------------------------------------------
  # 9. Nginx - Unified Entry Point (Reverse Proxy)
  # ----------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: jledger-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      finance-service:
        condition: service_started
      portal-service:
        condition: service_started
    networks:
      - jledger-network

volumes:
  pgdata:
  redisdata:

networks:
  jledger-network:
    driver: bridge
