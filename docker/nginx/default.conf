# HTTP to HTTPS Redirect
server {
    listen 80;
    server_name potayyr.site www.potayyr.site;

    location /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# SSL Configuration
server {
    listen 443 ssl;
    server_name potayyr.site www.potayyr.site;

    ssl_certificate /etc/letsencrypt/live/potayyr.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/potayyr.site/privkey.pem;

    # Recommendations from SSL Labs
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'" always;

    location /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Finance Service (Wallets, Transactions, Transfers)
    location /api/finance/ {
        proxy_pass http://finance-service:8081/api/finance/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service - Identity (Auth, Users, Sessions)
    location /api/identity/ {
        proxy_pass http://portal-service:3000/api/identity/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service - KYC (Documents, PII)
    location /api/kyc/ {
        proxy_pass http://portal-service:3000/api/kyc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service - Admin (Staff, Roles)
    location /api/admin/ {
        proxy_pass http://portal-service:3000/api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service - Integration (Banks, Merchants)
    location /api/integration/ {
        proxy_pass http://portal-service:3000/api/integration/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service - Audit (Logs)
    location /api/audit/ {
        proxy_pass http://portal-service:3000/api/audit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service - Reporting (Reports)
    location /api/reporting/ {
        proxy_pass http://portal-service:3000/api/reporting/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service Root
    location / {
        proxy_pass http://portal-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
