# HTTP to HTTPS Redirect
server {
    listen 80;
    server_name potayyr.site www.potayyr.site;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

# SSL Configuration
server {
    listen 443 ssl;
    server_name potayyr.site www.potayyr.site;

    ssl_certificate /etc/letsencrypt/live/potayyr.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/potayyr.site/privkey.pem;

    # Recommendations from SSL Labs
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Finance Service (Wallets, Transactions, Transfers)
    location /api/finance/ {
        proxy_pass http://finance-service:8081/api/finance/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service (Integration, Audit, Reporting)
    location /api/portal/ {
        proxy_pass http://portal-service:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal Service Root
    location / {
        proxy_pass http://portal-service:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
