# Allocate enough JVM heap memory to prevent OutOfMemoryError in D8/R8 dex merger on GitHub Actions
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Duser.language=en -Duser.country=US

# Enable AndroidX support to resolve compile-time checks for modern dependencies
android.useAndroidX=true

# Disable Jetifier since all dependencies in this project are already modern AndroidX.
# This prevents "Cannot mutate the dependencies" errors and speeds up the build process.
android.enableJetifier=false
