server:
  port: 8082

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${JLEDGER_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: ${JLEDGER_NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${JLEDGER_NOTIFICATION_DB_USER:notification_user}
    password: ${JLEDGER_NOTIFICATION_DB_PASSWORD:notification_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jledger:
  outbox:
    topic: ${JLEDGER_OUTBOX_TOPIC:wallet.transaction.events}

springdoc:
  api-docs:
    path: /v3/api-docs
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    serviceUrl:
      defaultZone: ${JLEDGER_EUREKA_ZONE:http://localhost:8761/eureka/}
