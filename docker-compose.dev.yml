services:
  postgres:
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-scripts:/docker-entrypoint-initdb.d

  redis:
    ports:
      - "6379:6379"

  zookeeper:
    ports:
      - "2181:2181"

  kafka:
    ports:
      - "9092:9092"
    environment:
      # Override to include both internal (for docker services) and external (for local dev) listeners
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL

  pgadmin:
    image: dpage/pgadmin4
    container_name: jledger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jledger.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    networks:
      - jledger-network
    depends_on:
      - postgres

  finance-service:
    ports:
      - "8081:8081"

  portal-service:
    ports:
      - "3000:3000"

  portal-migration:
    environment:
      - JLEDGER_ADMIN_EMAIL=${JLEDGER_ADMIN_EMAIL}
      - JLEDGER_ADMIN_PASSWORD=${JLEDGER_ADMIN_PASSWORD}

  portal-seed:
    environment:
      - JLEDGER_ADMIN_EMAIL=${JLEDGER_ADMIN_EMAIL}
      - JLEDGER_ADMIN_PASSWORD=${JLEDGER_ADMIN_PASSWORD}
