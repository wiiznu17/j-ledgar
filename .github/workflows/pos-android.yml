name: POS Android Build

on:
  push:
    paths:
      - 'j-ledger-portal/apps/pos-terminal-app/**'
      - '.github/workflows/pos-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        working-directory: j-ledger-portal/apps/pos-terminal-app
        run: |
          # บิลด์แอป Android ระดับ Debug APK โดยใช้ระบบ Gradle ในระบบจำลอง
          gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-terminal-debug-apk
          path: j-ledger-portal/apps/pos-terminal-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
