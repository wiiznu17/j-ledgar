name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: j-ledger-portal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: j-ledger-portal/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Clients
        run: npm run postinstall

      - name: Run Linter
        run: npm run lint

      - name: Run Type Checker
        run: npm run check-types

      - name: Run Unit Tests
        run: npm run test
